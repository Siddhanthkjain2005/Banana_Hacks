name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Install pinned dependencies
        run: |
          npm ci
          npm ci --prefix api
      - name: Verify syntax and all geometry, neural, backend, and feature checks
        run: |
          node --check dist/app.js
          node --check dist/neural-worker.js
          for file in api/lib/*.cjs api/service/index.js server.mjs scripts/*.mjs; do node --check "$file"; done
          npm test
      - name: Run the end-to-end API demo on the bundled sample photographs
        run: npm run demo
